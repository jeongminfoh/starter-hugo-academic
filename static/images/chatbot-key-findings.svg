<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">Two interfaces, two patterns</title>
  <desc id="desc">For TANF application approvals, Colorado&#x27;s observed approval rate was above its synthetic comparison in 2020–2021 following menu-chatbot adoption in 2019. Montana&#x27;s observed rate was below its synthetic comparison in 2021 following conversational-chatbot adoption in 2020.</desc>
