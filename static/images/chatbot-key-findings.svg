  <text x="64" y="192" class="serif ink" font-size="62">Two interfaces, two patterns</text>
  <text x="66" y="241" class="sans muted" font-size="30">Cash-assistance approval rates after chatbot adoption</text>
  <path d="M768 300V846" stroke="#D8DDD4" stroke-width="2"/>

