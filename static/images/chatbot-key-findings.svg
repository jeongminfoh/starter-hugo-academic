<text x="370" y="655" text-anchor="middle" class="sans ink" font-size="40" font-weight="700"><tspan x="370">Menu-based chatbot</tspan></text>
<text x="370" y="741" text-anchor="middle" class="sans ink" font-size="32"><tspan x="370">Colorado&#x27;s approval rate was</tspan><tspan x="370" dy="42">above its comparison trend</tspan><tspan x="370" dy="42">after adoption.</tspan></text>
