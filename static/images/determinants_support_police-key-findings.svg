<text x="1136" y="642" text-anchor="middle" class="sans ink" font-size="38" font-weight="700"><tspan x="1136">Personal safety</tspan><tspan x="1136" dy="45">concerns</tspan></text>
<text x="1136" y="741" text-anchor="middle" class="sans ink" font-size="32"><tspan x="1136">Feeling less safe at work was</tspan><tspan x="1136" dy="42">not a clear predictor of support.</tspan></text>
<path d="M64 882H1472" stroke="#D3DACF" stroke-width="2"/>
