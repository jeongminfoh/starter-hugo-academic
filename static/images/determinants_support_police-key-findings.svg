      <path d="M-149 109H148" class="line"/>
      <path d="M-39 17L-6 43L35 6" fill="none" stroke="#E7EDE5" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="370" y="642" text-anchor="middle" class="sans ink" font-size="38" font-weight="700"><tspan x="370">Race and</tspan><tspan x="370" dy="45">racial attitudes</tspan></text>
<text x="370" y="727" text-anchor="middle" class="sans ink" font-size="30"><tspan x="370">White officers and those with</tspan><tspan x="370" dy="39">stronger racial resentment</tspan><tspan x="370" dy="39">reported more support for</tspan><tspan x="370" dy="39">military equipment.</tspan></text>
<circle cx="1136" cy="452" r="150" fill="#E7EDE5"/>
<g transform="translate(1136 452)">
      <path d="M0-139C41-112 84-100 132-94V-16C132 64 78 118 0 150C-78 118-132 64-132-16V-94C-84-100-41-112 0-139Z" fill="#E7EDE5" class="line"/>
