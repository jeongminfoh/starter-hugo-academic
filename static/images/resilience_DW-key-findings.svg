<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">Trust and cooperation in disaster recovery</title>
  <desc id="desc">Across citizens, experts and local public officials in South Korea&#x27;s 2017 emergency management survey, greater trust and better-rated cooperation were each associated with stronger ratings of government disaster capacity.</desc>
  <defs><style>
    .sans{font-family:Arial,Helvetica,sans-serif}
    .serif{font-family:Georgia,'Times New Roman',serif}
    .ink{fill:#193C32}
    .muted{fill:#557C70}
    .line{fill:none;stroke:#193C32;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
    .softline{fill:none;stroke:#557C70;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
  </style></defs>
  <rect width="1536" height="1024" fill="#F7F6F0"/>
  <path d="M64 64H1472" stroke="#193C32" stroke-width="4"/>
  <text x="64" y="110" class="sans muted" font-size="24" font-weight="700" letter-spacing="3">TRUST AND DISASTER RESILIENCE</text>
  <text x="64" y="192" class="serif ink" font-size="62">Trust and cooperation in disaster recovery</text>
  <text x="66" y="241" class="sans muted" font-size="30">A shared pattern across citizens, experts and public officials</text>
  <path d="M768 300V846" stroke="#D8DDD4" stroke-width="2"/>

<circle cx="370" cy="452" r="150" fill="#E9EBDD"/>
<g transform="translate(370 452)">
      <path d="M-151-56L0-138L151-56Z" fill="#E7EDE5" class="line"/>
      <path d="M-128-32H128M-138 117H138M-153 142H153" class="line"/>
      <path d="M-111-27V110M-72-27V110M-20-27V110M20-27V110M72-27V110M111-27V110" class="softline"/>
      <circle cx="0" cy="-81" r="20" fill="#B29457"/></g>
<text x="370" y="655" text-anchor="middle" class="sans ink" font-size="40" font-weight="700"><tspan x="370">Trust in government</tspan></text>
<text x="370" y="741" text-anchor="middle" class="sans ink" font-size="32"><tspan x="370">Greater trust was linked to</tspan><tspan x="370" dy="42">stronger ratings of government</tspan><tspan x="370" dy="42">disaster capacity.</tspan></text>
<circle cx="1136" cy="452" r="150" fill="#E7EDE5"/>
<g transform="translate(1136 452)">
      <circle cx="-86" cy="-44" r="31" fill="#B29457"/>
      <path d="M-137 78V26C-137-5-112-16-86-16C-58-16-35 0-35 26V78" fill="#557C70"/>
      <circle cx="83" cy="-44" r="31" fill="#B29457"/>
      <path d="M32 78V26C32-5 57-16 83-16C111-16 134 0 134 26V78" fill="#557C70"/>
      <circle cx="-2" cy="-85" r="35" fill="#557C70"/>
      <path d="M-58 60V-9C-58-40-31-53-2-53C27-53 53-34 53-9V60" fill="#193C32"/>
      <path d="M-149 109H148" class="line"/>
      <path d="M-39 17L-6 43L35 6" fill="none" stroke="#E7EDE5" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="1136" y="655" text-anchor="middle" class="sans ink" font-size="40" font-weight="700"><tspan x="1136">Working together</tspan></text>
<text x="1136" y="741" text-anchor="middle" class="sans ink" font-size="32"><tspan x="1136">More positive views of cooperation</tspan><tspan x="1136" dy="42">were also linked to stronger ratings</tspan><tspan x="1136" dy="42">of government disaster capacity.</tspan></text>
<path d="M64 882H1472" stroke="#D3DACF" stroke-width="2"/>
  <text x="64" y="929" class="sans ink" font-size="27" font-weight="700">South Korea · 2017 National Survey on Emergency Management</text>
</svg>