<text x="1136" y="655" text-anchor="middle" class="sans ink" font-size="40" font-weight="700"><tspan x="1136">Views of the economy</tspan></text>
<text x="1136" y="741" text-anchor="middle" class="sans ink" font-size="32"><tspan x="1136">Greater trust was linked to</tspan><tspan x="1136" dy="42">more positive views of the economy</tspan><tspan x="1136" dy="42">and family finances.</tspan></text>
<path d="M64 882H1472" stroke="#D3DACF" stroke-width="2"/>
  <text x="64" y="929" class="sans ink" font-size="27" font-weight="700">Asian Barometer Survey, Wave 3 · Lim, Oh &amp; Kwon (2016)</text>
