      <path d="M-111-27V110M-72-27V110M-20-27V110M20-27V110M72-27V110M111-27V110" class="softline"/>
      <circle cx="0" cy="-81" r="20" fill="#B29457"/></g>
<text x="370" y="655" text-anchor="middle" class="sans ink" font-size="40" font-weight="700"><tspan x="370">Views of governance</tspan></text>
<text x="370" y="741" text-anchor="middle" class="sans ink" font-size="32"><tspan x="370">More positive views of governance</tspan><tspan x="370" dy="42">were linked to greater trust</tspan><tspan x="370" dy="42">in government.</tspan></text>
<circle cx="1136" cy="452" r="150" fill="#E7EDE5"/>
<g transform="translate(1136 452)">
      <ellipse cx="-56" cy="100" rx="79" ry="29" fill="#EFE7D5" stroke="#B29457" stroke-width="5"/>
