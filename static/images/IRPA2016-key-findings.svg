      <ellipse cx="-56" cy="26" rx="79" ry="29" fill="#EFE7D5" stroke="#B29457" stroke-width="5"/>
      <circle cx="71" cy="-42" r="80" fill="#F7F6F0" class="line"/>
      <circle cx="71" cy="-42" r="61" fill="none" stroke="#557C70" stroke-width="4"/>
