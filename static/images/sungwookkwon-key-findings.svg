<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">Making plans and tracking progress</title>
  <desc id="desc">In a 2015 U.S. local-government survey, public participation was positively associated with adopting a sustainability plan. Coordination across government functions was positively associated with using performance measures among plan adopters.</desc>
  <defs><style>
    .sans{font-family:Arial,Helvetica,sans-serif}
    .serif{font-family:Georgia,'Times New Roman',serif}
    .ink{fill:#193C32}
    .muted{fill:#557C70}
    .line{fill:none;stroke:#193C32;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
    .softline{fill:none;stroke:#557C70;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
  </style></defs>
  <rect width="1536" height="1024" fill="#F7F6F0"/>
  <path d="M64 64H1472" stroke="#193C32" stroke-width="4"/>
  <text x="64" y="110" class="sans muted" font-size="24" font-weight="700" letter-spacing="3">LOCAL SUSTAINABILITY</text>
  <text x="64" y="192" class="serif ink" font-size="62">Making plans and tracking progress</text>
  <text x="66" y="241" class="sans muted" font-size="30">Different organizational links appeared at the two stages</text>
  <path d="M768 300V846" stroke="#D8DDD4" stroke-width="2"/>

<circle cx="370" cy="452" r="150" fill="#E9EBDD"/>
<g transform="translate(370 452)">
      <rect x="-139" y="-116" width="280" height="253" rx="14" fill="#F7F6F0" class="line"/>
      <path d="M-139-62H141M-87-137V-94M87-137V-94" class="softline"/>
      <rect x="-105" y="-29" width="49" height="42" rx="5" fill="#E7EDE5"/>
      <rect x="-24" y="-29" width="49" height="42" rx="5" fill="#B29457"/>
      <rect x="57" y="-29" width="49" height="42" rx="5" fill="#E7EDE5"/>
      <path d="M-98 62L-86 74L-64 47M-19 60H104M-19 86H72" class="softline"/></g>
<text x="370" y="655" text-anchor="middle" class="sans ink" font-size="40" font-weight="700"><tspan x="370">Adopting a plan</tspan></text>
<text x="370" y="741" text-anchor="middle" class="sans ink" font-size="32"><tspan x="370">More public participation</tspan><tspan x="370" dy="42">was linked to having</tspan><tspan x="370" dy="42">a sustainability plan.</tspan></text>
<circle cx="1136" cy="452" r="150" fill="#E7EDE5"/>
<g transform="translate(1136 452)">
      <rect x="-106" y="-115" width="194" height="253" rx="13" fill="#F7F6F0" class="line"/>
      <rect x="-58" y="-132" width="98" height="37" rx="9" fill="#E7EDE5" class="line"/>
      <path d="M-74-49L-62-37L-41-61M-20-48H54M-74 7L-62 19L-41-5M-20 8H54" class="softline"/>
      <rect x="-74" y="56" width="30" height="30" rx="3" fill="none" stroke="#B29457" stroke-width="5"/>
      <path d="M-20 70H54" fill="none" stroke="#B29457" stroke-width="5" stroke-linecap="round"/>
      <circle cx="122" cy="78" r="39" fill="#EFE7D5" stroke="#B29457" stroke-width="5"/>
      <path d="M150 106L178 134" fill="none" stroke="#8E743F" stroke-width="10" stroke-linecap="round"/></g>
<text x="1136" y="655" text-anchor="middle" class="sans ink" font-size="40" font-weight="700"><tspan x="1136">Tracking progress</tspan></text>
<text x="1136" y="727" text-anchor="middle" class="sans ink" font-size="30"><tspan x="1136">Among plan adopters,</tspan><tspan x="1136" dy="39">more coordination across functions</tspan><tspan x="1136" dy="39">was linked to using</tspan><tspan x="1136" dy="39">performance measures.</tspan></text>
<path d="M64 882H1472" stroke="#D3DACF" stroke-width="2"/>
  <text x="64" y="929" class="sans ink" font-size="27" font-weight="700">U.S. local-government survey, 2015</text>
</svg>