      <path d="M60-40H117L150-7V136H60Z" fill="#EFE7D5" stroke="#B29457" stroke-width="5" stroke-linejoin="round"/>
      <path d="M117-40V-7H150M79 23H129M79 50H129M79 78H129M79 106H111" fill="none" stroke="#8E743F" stroke-width="5" stroke-linecap="round"/></g>
<text x="370" y="642" text-anchor="middle" class="sans ink" font-size="38" font-weight="700"><tspan x="370">Fewer paperless</tspan><tspan x="370" dy="45">voting machines</tspan></text>
<text x="370" y="741" text-anchor="middle" class="sans ink" font-size="32"><tspan x="370">Used by 44% of reporting local</tspan><tspan x="370" dy="42">jurisdictions in 2012,</tspan><tspan x="370" dy="42">compared with 1.3% in 2024.</tspan></text>
<circle cx="1136" cy="452" r="150" fill="#E7EDE5"/>
<g transform="translate(1136 452)">
