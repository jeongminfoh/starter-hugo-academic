<text x="1136" y="642" text-anchor="middle" class="sans ink" font-size="38" font-weight="700"><tspan x="1136">Uneven e-poll</tspan><tspan x="1136" dy="45">book oversight</tspan></text>
<text x="1136" y="741" text-anchor="middle" class="sans ink" font-size="32"><tspan x="1136">In 2024, 16 of 41 adopting</tspan><tspan x="1136" dy="42">state-level jurisdictions had</tspan><tspan x="1136" dy="42">no testing or certification rule.</tspan></text>
