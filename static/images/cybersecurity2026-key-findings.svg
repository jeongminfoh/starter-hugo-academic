<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">Paper trails grew. Oversight gaps remained.</title>
  <desc id="desc">Voting machines without paper audit trails were reported by 44% of responding local jurisdictions in 2012 and 1.3% in 2024. In 2024, 16 of 41 state-level jurisdictions using electronic poll books had no formal testing or certification requirement.</desc>
  <defs><style>
    .sans{font-family:Arial,Helvetica,sans-serif}
    .serif{font-family:Georgia,'Times New Roman',serif}
    .ink{fill:#193C32}
    .muted{fill:#557C70}
    .line{fill:none;stroke:#193C32;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
    .softline{fill:none;stroke:#557C70;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
  </style></defs>
  <rect width="1536" height="1024" fill="#F7F6F0"/>
  <path d="M64 64H1472" stroke="#193C32" stroke-width="4"/>
  <text x="64" y="110" class="sans muted" font-size="24" font-weight="700" letter-spacing="3">U.S. ELECTION CYBERSECURITY</text>
  <text x="64" y="192" class="serif ink" font-size="62">Paper trails grew. Oversight gaps remained.</text>
  <text x="66" y="241" class="sans muted" font-size="30">How election practices changed from 2012 to 2024</text>
  <path d="M768 300V846" stroke="#D8DDD4" stroke-width="2"/>

