      <circle cx="-91" cy="78" r="37" fill="#B29457"/>
      <circle cx="115" cy="-23" r="10" fill="#F7F6F0"/></g>
<text x="370" y="655" text-anchor="middle" class="sans ink" font-size="40" font-weight="700"><tspan x="370">Mostly one-way sharing</tspan></text>
<text x="370" y="716" text-anchor="middle" class="sans ink" font-size="35"><tspan x="370">The largest Twitter groups</tspan><tspan x="370" dy="47">showed few repeated exchanges.</tspan></text>
<circle cx="1136" cy="452" r="150" fill="#E7EDE5"/>
<g transform="translate(1136 452)">
