      <path d="M-4 3C32 36 20 56 42 64C68 75 42 119 10 120C-27 119-44 93-30 63C-15 43-14 17-4 3Z" fill="#B29457"/>
      <path d="M-159 42V137M-159-95L-206-12H-179L-211 42H-108L-140-12H-112Z" fill="#E7EDE5" stroke="#557C70" stroke-width="6" stroke-linejoin="round"/></g>
<text x="1136" y="655" text-anchor="middle" class="sans ink" font-size="40" font-weight="700"><tspan x="1136">Little evacuation guidance</tspan></text>
<text x="1136" y="741" text-anchor="middle" class="sans ink" font-size="32"><tspan x="1136">Conversations focused on</tspan><tspan x="1136" dy="42">firefighter stories and fundraising,</tspan><tspan x="1136" dy="42">with little attention to evacuation.</tspan></text>
