      <ellipse cx="-56" cy="26" rx="79" ry="29" fill="#EFE7D5" stroke="#B29457" stroke-width="5"/>
      <circle cx="71" cy="-42" r="80" fill="#F7F6F0" class="line"/>
      <circle cx="71" cy="-42" r="61" fill="none" stroke="#557C70" stroke-width="4"/>
      <path d="M95-76C62-94 35-67 71-43C106-20 83 6 48-9M71-91V8" class="softline"/></g>
<text x="370" y="642" text-anchor="middle" class="sans ink" font-size="38" font-weight="700"><tspan x="370">Losing scholarship</tspan><tspan x="370" dy="45">access</tspan></text>
<text x="370" y="741" text-anchor="middle" class="sans ink" font-size="32"><tspan x="370">Linked to lower trust in</tspan><tspan x="370" dy="42">state government.</tspan></text>
<circle cx="1136" cy="452" r="150" fill="#E7EDE5"/>
<g transform="translate(1136 452)">
      <circle cx="-86" cy="-44" r="31" fill="#B29457"/>
      <path d="M-137 78V26C-137-5-112-16-86-16C-58-16-35 0-35 26V78" fill="#557C70"/>
      <circle cx="83" cy="-44" r="31" fill="#B29457"/>
      <path d="M32 78V26C32-5 57-16 83-16C111-16 134 0 134 26V78" fill="#557C70"/>
      <circle cx="-2" cy="-85" r="35" fill="#557C70"/>
      <path d="M-58 60V-9C-58-40-31-53-2-53C27-53 53-34 53-9V60" fill="#193C32"/>
      <path d="M-149 109H148" class="line"/>
