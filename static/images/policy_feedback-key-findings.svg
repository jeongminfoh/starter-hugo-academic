<text x="1136" y="642" text-anchor="middle" class="sans ink" font-size="38" font-weight="700"><tspan x="1136">Differences across</tspan><tspan x="1136" dy="45">racial groups</tspan></text>
<text x="1136" y="727" text-anchor="middle" class="sans ink" font-size="30"><tspan x="1136">The link between losing aid and</tspan><tspan x="1136" dy="39">lower trust was stronger among</tspan><tspan x="1136" dy="39">racial minority respondents than</tspan><tspan x="1136" dy="39">White respondents.</tspan></text>
